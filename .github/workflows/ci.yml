name: CI

on:
  push:
    paths:
      - '.github/workflows/ci.yml'
      - 'src/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'version.json'
      - 'LICENSE'
      - '.nvmrc'
      - '.node-version'
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - 'src/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'version.json'
      - 'LICENSE'
      - '.nvmrc'
      - '.node-version'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build on ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:all
      - uses: actions/upload-artifact@v7
        with:
          name: neox-dev-build-${{ matrix.os }}-node-${{ matrix.node }}
          path: dist/
          retention-days: 7
