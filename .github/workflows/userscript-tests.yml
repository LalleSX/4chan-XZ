name: Userscript browser tests

on:
  push:
    paths:
      - '.github/workflows/userscript-tests.yml'
      - 'src/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'version.json'
      - 'LICENSE'
      - '.nvmrc'
      - '.node-version'
      - 'tests/**'
      - 'playwright.userscript.config.ts'
  pull_request:
    paths:
      - '.github/workflows/userscript-tests.yml'
      - 'src/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'version.json'
      - 'LICENSE'
      - '.nvmrc'
      - '.node-version'
      - 'tests/**'
      - 'playwright.userscript.config.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:userscript
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chromium-userscript-results
          path: |
            playwright-report/userscript/
            test-results/userscript/
          retention-days: 7
