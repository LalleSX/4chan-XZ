name: Extension browser tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:extension
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chromium-extension-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
